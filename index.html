    // --- CONVERSOR DE NÚMEROS A LETRAS EN ESPAÑOL ---
    function numeroALetras(monto) {
      if (isNaN(monto) || monto === null) return "";
      const entero = Math.floor(Math.abs(monto));
      const decimales = Math.round((Math.abs(monto) - entero) * 100);

      const Unidades = ["", "UN", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE"];
      const Decenas = ["", "DIEZ", "VEINTE", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
      const Dieces = ["DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISEIS", "DIECISIETE", "DIECIOCHO", "DIECINUEVE"];
      const Veintes = ["VEINTE", "VEINTIUNO", "VEINTIDOS", "VEINTITRES", "VEINTICUATRO", "VEINTICINCO", "VEINTISEIS", "VEINTISIETE", "VEINTIOCHO", "VEINTINUEVE"];
      const Centenas = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];

      function seccion(num, divisor, strSingular, strPlural) {
        const cientos = Math.floor(num / divisor);
        const resto = num - (cientos * divisor);
        let letras = "";
        if (cientos > 0) {
          if (cientos > 1) {
            letras = resolverTresCifras(cientos) + " " + strPlural;
          } else {
            letras = strSingular;
          }
        }
        return { letras, resto };
      }

      function resolverTresCifras(num) {
        if (num === 0) return "";
        if (num === 100) return "CIEN";
        let out = "";
        const c = Math.floor(num / 100);
        const d = Math.floor((num % 100) / 10);
        const u = num % 10;

        if (c > 0) out += Centenas[c] + " ";

        const decYUnid = num % 100;
        if (decYUnid >= 10 && decYUnid <= 19) {
          out += Dieces[decYUnid - 10];
        } else if (decYUnid >= 20 && decYUnid <= 29) {
          out += Veintes[decYUnid - 20];
        } else {
          if (d > 0) {
            out += Decenas[d];
            if (u > 0) out += " Y " + Unidades[u];
          } else if (u > 0) {
            out += Unidades[u];
          }
        }
        return out.trim();
      }

      if (entero === 0) {
        return `CERO CON ${decimales.toString().padStart(2, '0')}/100`;
      }

      let res = "";
      let temp = entero;

      const millones = seccion(temp, 1000000, "UN MILLON", "MILLONES");
      if (millones.letras) res += millones.letras + " ";
      temp = millones.resto;

      const miles = seccion(temp, 1000, "UN MIL", "MIL");
      if (miles.letras) res += miles.letras + " ";
      temp = miles.resto;

      if (temp > 0) {
        res += resolverTresCifras(temp);
      }

      const strCentavos = decimales.toString().padStart(2, '0');
      return `${res.trim()} CON ${strCentavos}/100`;
    }

    // --- FORMATEADORES ---
    const formatCurrency = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('es-AR', {

        maximumFractionDigits: 2

    };

    const formatDateAR = (isoString) => {
      if (!isoString) return "";
      try {
        if (typeof isoString === 'string' && isoString.includes('T')) {
          const d = new Date(isoString);
          return d.toLocaleDateString('es-AR');
        }
        const parts = String(isoString).split('-');
        if (parts.length === 3) return `${parts[2].slice(0, 2)}/${parts[1]}/${parts[0]}`;
        const d = new Date(isoString);
        return isNaN(d.getTime()) ? String(isoString) : d.toLocaleDateString('es-AR');
      } catch (e) {
        return String(isoString);
      }
    };

      const num = (numberStr || 'RET-000000').trim();
      const cleanName = (supplierName || 'Proveedor')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // eliminar acentos
        .replace(/[^a-zA-Z0-9]+/g, '_')                    // reemplazar espacios, puntos y caracteres especiales por _
        .replace(/^_+|_+$/g, '');                          // eliminar _ sobrantes al inicio y final
      return `${num}_${cleanName}.pdf`;
    };

      // Seguridad / Login por contraseña
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          return sessionStorage.getItem('bailac_authenticated') === 'true';
        } catch (e) {

      // Bloquear foco e interacción del fondo cuando no está autenticado
      useEffect(() => {
        if (appContentRef.current) {

      const handleLoginSubmit = (e) => {
        e.preventDefault();

        const base = parseFloat(baseImponible) || 0;
        const ali = parseFloat(alicuota) || 0;
        if (base <= 0 || ali <= 0) return 0;
        return Math.round((base * (ali / 100)) * 100) / 100;
      }, [baseImponible, alicuota]);

      const filteredSubjects = useMemo(() => {
        if (!searchTerm.trim()) return [];
        const term = searchTerm.toLowerCase().replace(/[^a-z0-9]/g, '');
        return knownSubjects.filter(s => {
          const cuitClean = (s.cuit || '').replace(/[^0-9]/g, '');
          const rs = (s.razonSocial || '').toLowerCase();
          return rs.includes(searchTerm.toLowerCase()) || cuitClean.includes(term);
        }).slice(0, 8);
      }, [searchTerm, knownSubjects]);

        if (s.alicuota) setAlicuota(Number(s.alicuota).toFixed(2));

        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast('El archivo debe ser una imagen PNG o JPG', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          setDigitalSignature(event.target.result);
          showToast('Firma digital cargada correctamente');

        reader.readAsDataURL(file);

      // --- SINCRONIZACIÓN DE SUJETOS (doGet Caso 2) ---
      const handleSyncSubjectsFromSheet = async (isSilent = false) => {
        if (!googleSheetUrl) return;
        setIsSyncingSubjects(true);
        try {
          const sep = googleSheetUrl.includes('?') ? '&' : '?';
          const url = `${googleSheetUrl}${sep}_t=${Date.now()}`;
          const res = await fetch(url, { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          if (data && Array.isArray(data.subjects) && data.subjects.length > 0) {
            setKnownSubjects(data.subjects);
            if (!isSilent) {
              showToast(`¡Sincronizado! Se cargaron ${data.subjects.length} proveedores reales desde la planilla.`);

          console.error("Error al sincronizar sujetos:", err);

        try {
          const payload = {
            retentionNumber: retentionObj.retentionNumber || currentFormattedNumber,

            razonSocial: retentionObj.razonSocial,
            cuit: retentionObj.cuit,

            domicilio: retentionObj.domicilio,
            taxType: retentionObj.taxType || (retentionObj.tipoImpuesto?.includes('Convenio') ? 'CM' : 'IIBB'),
            nroFactura: retentionObj.nroFactura || retentionObj.facturaOrigen || '',
            baseImponible: Number(retentionObj.baseImponible) || 0,
            alicuota: Number(retentionObj.alicuota) || 0,
            total: Number(retentionObj.total) || Number(retentionObj.importeRetenido) || 0,
            observaciones: retentionObj.observaciones || ''
          };

          // Envío en 'text/plain;charset=utf-8' con mode: 'no-cors' para evitar preflight OPTIONS
          await fetch(googleSheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          });

          return { success: true };
        } catch (err) {
          console.error("Error al sincronizar con Apps Script:", err);
          return { success: false, error: err.message };
        }
      };

      // --- ACTUALIZAR ÚLTIMAS FILAS Y CORRELATIVO REMOTO ---
      const handleUpdateFromSheets = async () => {
        if (!googleSheetUrl) {
          setShowSettingsModal(true);
          showToast('Configura la URL de Apps Script', 'info');
          return;
        }

        setIsUpdatingFromSheets(true);
        try {
          // 1. Sincronizar sujetos
          await handleSyncSubjectsFromSheet(true);

          // 2. Búsqueda rápida de la última fila con datos usando sonda exponencial / binaria
          const sep = googleSheetUrl.includes('?') ? '&' : '?';
          let low = 100;
          let high = 250;
          let lastGoodRow = 135;

          const checkRow = async (r) => {
            try {
              const res = await fetch(`${googleSheetUrl}${sep}row=${r}&_t=${Date.now()}`);
              if (!res.ok) return false;
              const data = await res.json();
              return data.status === 'success' && data.retention && data.retention.razonSocial;
            } catch (e) {
              return false;
            }
          };

          // Sondeo rápido
          while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            const ok = await checkRow(mid);
            if (ok) {
              lastGoodRow = mid;
              low = mid + 1;
            } else {
              high = mid - 1;
            }
          }

          // 3. Traer las últimas 5 filas encontradas
          const rowPromises = [];
          for (let r = lastGoodRow; r >= Math.max(2, lastGoodRow - 4); r--) {
            rowPromises.push(
              fetch(`${googleSheetUrl}${sep}row=${r}&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => ({ row: r, data }))
                .catch(() => null)
            );
          }

          const results = await Promise.all(rowPromises);
          const newRetentions = [];
          let maxFoundId = nextId;

          results.forEach(item => {
            if (item && item.data && item.data.status === 'success' && item.data.retention) {
              const ret = item.data.retention;
              const numParsed = parseInt(String(ret.retentionNumber).replace(/[^0-9]/g, ''), 10);
              if (!isNaN(numParsed) && numParsed > maxFoundId) {
                maxFoundId = numParsed;
              }

              newRetentions.push({
                id: numParsed || item.row,
                retentionNumber: ret.retentionNumber,
                numeroFormateado: ret.retentionNumber,
                date: ret.date ? new Date(ret.date).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
                fecha: ret.date ? new Date(ret.date).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
                cuit: ret.cuit,
                razonSocial: ret.razonSocial,
                nroIIBB: ret.nroIIBB,
                domicilio: ret.domicilio,
                taxType: ret.taxType || 'CM',
                tipoImpuesto: ret.taxType === 'IIBB' ? 'IIBB Local (San Juan)' : 'Convenio Multilateral (CM)',
                nroFactura: ret.nroFactura,
                facturaOrigen: ret.nroFactura,
                baseImponible: Number(ret.baseImponible) || 0,
                alicuota: Number(ret.alicuota) || 0,
                total: Number(ret.total) || 0,
                importeRetenido: Number(ret.total) || 0,
                observaciones: ret.observaciones || '',
                syncedWithSheets: true,
                sheetRow: item.row,
                timestamp: new Date().toISOString()
              });
            }
          });

          if (newRetentions.length > 0) {
            setRetentions(prev => {
              const existingNums = new Set(prev.map(p => p.retentionNumber));
              const merged = [...newRetentions.filter(n => !existingNums.has(n.retentionNumber)), ...prev];
              return merged.slice(0, 50);
            });

            // Sugerir el siguiente correlativo
            const nextCorrelative = maxFoundId + 1;
            setNextId(nextCorrelative);
            showToast(`Sincronización exitosa: Última fila #${lastGoodRow}. Siguiente N°: RET-${nextCorrelative.toString().padStart(6, '0')}`);
          } else {
            showToast('Sincronización completada sin nuevos comprobantes remotos.', 'info');
          }

        } catch (err) {
          console.error("Error en sincronización:", err);
          showToast('Error al conectar con la planilla remota: ' + err.message, 'error');
        } finally {
          setIsUpdatingFromSheets(false);
        }

          const url = `${googleSheetUrl}${sep}row=${rowNum}&_t=${Date.now()}`;
          const res = await fetch(url, { method: 'GET' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          if (data.status === 'success' && data.retention) {
            const ret = data.retention;
            const numericId = parseInt(String(ret.retentionNumber).replace(/[^0-9]/g, ''), 10) || Date.now();
            const mappedRetention = {

              cuit: ret.cuit,
              razonSocial: ret.razonSocial,
              nroIIBB: ret.nroIIBB,
              domicilio: ret.domicilio,
              taxType: ret.taxType || 'CM',
              tipoImpuesto: ret.taxType === 'IIBB' ? 'IIBB Local (San Juan)' : 'Convenio Multilateral (CM)',
              nroFactura: ret.nroFactura,
              facturaOrigen: ret.nroFactura,
              baseImponible: Number(ret.baseImponible) || 0,

              total: Number(ret.total) || 0,
              importeRetenido: Number(ret.total) || 0,

        setIsEmitting(true);

        const currentId = nextId;
        const formattedNumber = currentFormattedNumber;
        const total = Math.round((base * (ali / 100)) * 100) / 100;

        const newRetention = {
          id: currentId,
          retentionNumber: formattedNumber,
          numeroFormateado: formattedNumber,
          date: fechaEmision,
          fecha: fechaEmision,
          cuit: cuit.trim(),
          razonSocial: razonSocial.trim().toUpperCase(),
          nroIIBB: nroIIBB.trim() || cuit.replace(/[^0-9]/g, ''),
          domicilio: domicilio.trim() || 'San Juan',
          taxType: taxType,
          tipoImpuesto: taxType === 'IIBB' ? 'IIBB Local (San Juan)' : 'Convenio Multilateral (CM)',
          nroFactura: nroFactura.trim() || 'N/A',
          facturaOrigen: nroFactura.trim() || 'N/A',
          baseImponible: base,
          alicuota: ali,
          total: total,
          importeRetenido: total,
          observaciones: observaciones.trim(),
          syncedWithSheets: false,
          timestamp: new Date().toISOString()
        };

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          buildCertificateDoc(doc, newRetention, digitalSignature);
          const pdfName = formatPdfFilename(formattedNumber, newRetention.razonSocial);
          doc.save(pdfName);
        } catch (pdfErr) {
          showToast('Error al generar el PDF: ' + pdfErr.message, 'error');
          setIsEmitting(false);
          return;
        }

        let wasSynced = false;
        if (autoSyncSheets && googleSheetUrl) {
          const syncRes = await syncRetentionToSheet(newRetention);
          if (syncRes.success) wasSynced = true;
        }

        newRetention.syncedWithSheets = wasSynced;

        setRetentions(prev => [newRetention, ...prev]);
        setNextId(prev => prev + 1);

        // Guardar proveedor frecuente si es nuevo
        const existingIdx = knownSubjects.findIndex(s => (s.cuit || '').replace(/[^0-9]/g, '') === cuit.replace(/[^0-9]/g, ''));
        if (existingIdx === -1) {
          setKnownSubjects(prev => [
            {
              cuit: newRetention.cuit,
              razonSocial: newRetention.razonSocial,
              nroIIBB: newRetention.nroIIBB,
              domicilio: newRetention.domicilio,
              taxType: newRetention.taxType,
              alicuota: newRetention.alicuota
            },
            ...prev
          ]);
        }

        setNroFactura('');
        setBaseImponible('');
        setObservaciones('');

        setIsEmitting(false);
        showToast(`Comprobante ${formattedNumber} emitido y descargado correctamente.` + (wasSynced ? ' Sincronizado a Google Sheets.' : ''));
      };

      const handleDownloadSinglePDF = (ret) => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });
          buildCertificateDoc(doc, ret, digitalSignature);
          const fname = ret.retentionNumber || ret.numeroFormateado || currentFormattedNumber;
          const pdfName = formatPdfFilename(fname, ret.razonSocial);
          doc.save(pdfName);
          showToast(`Descargando comprobante ${fname}...`);
        } catch (err) {
          showToast('Error al generar PDF: ' + err.message, 'error');
        }
      };

      // Exportar lote PDF
      const handleExportBatchPDF = () => {
        if (retentions.length === 0) {
          showToast('No hay comprobantes emitidos en el historial para exportar', 'info');
          return;
        }

        setIsBatchExporting(true);
        setTimeout(() => {
          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
              orientation: 'portrait',
              unit: 'mm',
              format: 'a4'
            });

            retentions.forEach((ret, index) => {
              if (index > 0) doc.addPage();
              buildCertificateDoc(doc, ret, digitalSignature);
            });

            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            doc.save(`LOTE_RETENCIONES_BAILAC_SAN_JUAN_${dateStr}_(${retentions.length}_comprobantes).pdf`);
            showToast(`Lote de ${retentions.length} comprobantes generado exitosamente`);
          } catch (err) {
            showToast('Error al exportar lote PDF: ' + err.message, 'error');
          } finally {
            setIsBatchExporting(false);
          }
        }, 150);
      };

      // Exportar TXT DGR San Juan
      const handleGenerateTxtDgr = () => {
        const dataToExport = retentions;
        if (dataToExport.length === 0) {
          showToast('No hay retenciones en el historial para generar el archivo TXT', 'info');
          return;
        }

        const lines = dataToExport.map(r => {
          const cuitClean = (r.cuit || '').replace(/[^0-9]/g, '').padStart(11, '0').substring(0, 11);
          const fechaStr = formatDateAR(r.date || r.fecha);
          const ptoVta = "0001";
          const numComp = r.id.toString().padStart(8, '0');
          const cuitAgente = AGENTE_RETENCION.cuit.replace(/[^0-9]/g, '').padStart(11, '0');

          const baseCents = Math.round(Number(r.baseImponible) * 100).toString().padStart(12, '0');
          const aliCents = Math.round(Number(r.alicuota) * 100).toString().padStart(5, '0');
          const totVal = r.total || r.importeRetenido || 0;
          const impCents = Math.round(Number(totVal) * 100).toString().padStart(12, '0');

          const razonSocialFixed = (r.razonSocial || '').padEnd(40, ' ').substring(0, 40);
          const tipoRegimen = (r.taxType === 'CM' || r.tipoImpuesto?.includes('Convenio')) ? 'CM ' : 'LOC';

          return `${cuitClean}${fechaStr}${ptoVta}${numComp}${cuitAgente}${baseCents}${aliCents}${impCents}${tipoRegimen}${razonSocialFixed}`;
        });

        const txtContent = lines.join('\r\n');
        const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        a.href = url;
        a.download = `RETENCIONES_DGR_SAN_JUAN_${dateStr}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setShowTxtModal(false);
        showToast(`Archivo TXT DGR exportado (${lines.length} registros)`);
      };

      const handleSaveCorrelative = (e) => {
        e.preventDefault();
        const parsed = parseInt(tempNextId, 10);
        if (isNaN(parsed) || parsed < 1) {
          showToast('Ingresa un número correlativo válido mayor a 0', 'error');
          return;
        }
        setNextId(parsed);
        setShowCorrelativeModal(false);
        showToast(`Próximo correlativo actualizado a: ${parsed}`);
      };

      // Descarga directa del archivo autónomo limpio (listo para servidor u offline)
      const handleDownloadAutonomousHtml = () => {
        try {
          const clone = document.documentElement.cloneNode(true);
          const rootEl = clone.querySelector('#root');
          if (rootEl) rootEl.innerHTML = '';

          // Quitar todos los scripts y estilos inyectados en tiempo de ejecución (Vite, script compilado de Babel en <head>, Tailwind runtime, etc.)
          clone.querySelectorAll('script:not([data-bailac-keep]), style:not([data-bailac-keep])').forEach((el) => {
            el.remove();
          });

          const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `index.html`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Archivo único index.html descargado y listo para tu servidor.');
        } catch (e) {
          showToast('Error al descargar archivo HTML: ' + e.message, 'error');
        }
      };

      const filteredRetentions = useMemo(() => {
        if (!historyFilter.trim()) return retentions;
        const q = historyFilter.toLowerCase().trim();
        return retentions.filter(r => 
          (r.razonSocial && r.razonSocial.toLowerCase().includes(q)) ||
          (r.cuit && r.cuit.includes(q)) ||
          (r.retentionNumber && r.retentionNumber.includes(q)) ||
          (r.numeroFormateado && r.numeroFormateado.includes(q)) ||
          (r.nroFactura && r.nroFactura.toLowerCase().includes(q)) ||
          (r.facturaOrigen && r.facturaOrigen.toLowerCase().includes(q))
        );
      }, [retentions, historyFilter]);

      return (
        <React.Fragment>
        <div
          ref={appContentRef}
          aria-hidden={!isAuthenticated}
          className={`flex flex-col min-h-screen transition-all duration-300 ${!isAuthenticated ? 'blur-md pointer-events-none select-none overflow-hidden h-screen' : ''}`}
        >
          {/* TOAST NOTIFICACIÓN */}
          {notification && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 text-white font-medium text-sm border ${
              notification.type === 'error' 
                ? 'bg-rose-600 border-rose-500' 
                : notification.type === 'info'
                ? 'bg-sky-600 border-sky-500'
                : 'bg-emerald-600 border-emerald-500'
            }`}>
              <i className={`fa-solid ${
                notification.type === 'error' ? 'fa-circle-exclamation' : notification.type === 'info' ? 'fa-circle-info' : 'fa-circle-check'
              } text-lg`}></i>
              <span>{notification.message}</span>
            </div>
          )}

          {/* BARRA SUPERIOR / ENCABEZADO */}
          <header className="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
              
              {/* Logo e Identidad Bailac */}
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 bg-bailac rounded-xl flex items-center justify-center shadow-lg shadow-orange-500/20 text-white">
                  <i className="fa-solid fa-file-invoice-dollar text-2xl"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-xl tracking-tight text-white">BAILAC</span>
                    <span className="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-bailac/20 text-orange-400 border border-orange-500/30">
                      San Juan
                    </span>
                    <span className="hidden sm:inline-flex items-center gap-1 text-[10px] bg-emerald-950/70 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full font-mono">
                      <i className="fa-solid fa-circle text-[6px] text-emerald-400 animate-pulse"></i> Apps Script Conectado
                    </span>
                  </div>
                  <h1 className="text-xs text-slate-300 font-medium">
                    Sistema de Emisión de Retenciones IIBB / CM · CUIT 30-71155040-9
                  </h1>
                </div>
              </div>

              {/* Indicador de Próximo Correlativo */}
              <div className="flex items-center gap-2 bg-slate-800/90 border border-slate-700/80 px-3.5 py-1.5 rounded-xl">
                <div className="flex flex-col">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold">Próximo N°</span>
                  <span className="font-mono text-sm font-bold text-orange-400 tracking-wider">
                    {currentFormattedNumber}
                  </span>
                </div>
                <div className="flex items-center gap-1 ml-2 border-l border-slate-700 pl-2">
                  <button 
                    type="button" 
                    title="Editar correlativo manualmente"
                    onClick={() => {
                      setTempNextId(nextId);
                      setShowCorrelativeModal(true);
                    }}
                    className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors text-xs"
                  >
                    <i className="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button 
                    type="button" 
                    title="Actualizar y verificar correlativo desde Sheets"
                    onClick={handleUpdateFromSheets}
                    disabled={isUpdatingFromSheets}
                    className="p-1.5 text-slate-400 hover:text-orange-400 hover:bg-slate-700 rounded-lg transition-colors text-xs"
                  >
                    <i className={`fa-solid fa-arrows-rotate ${isUpdatingFromSheets ? 'fa-spin text-orange-400' : ''}`}></i>
                  </button>
                </div>
              </div>

              {/* Botones de Acción Rápida */}
              <div className="flex items-center gap-2 flex-wrap">
                
                {/* Sincronizar Proveedores desde Sheets */}
                <button
                  type="button"
                  onClick={() => handleSyncSubjectsFromSheet(false)}
                  disabled={isSyncingSubjects}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all hover:border-orange-500/50"
                  title="Consulta la planilla y sincroniza la lista de proveedores aprendidos"
                >
                  <i className={`fa-solid fa-users ${isSyncingSubjects ? 'fa-spin text-orange-400' : 'text-orange-400'}`}></i>
                  <span>Sincronizar Proveedores ({knownSubjects.length})</span>
                </button>

                {/* Reimprimir por N° de Fila */}
                <button
                  type="button"
                  onClick={() => {
                    setFoundRowRetention(null);
                    setShowRowSearchModal(true);
                  }}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all hover:border-emerald-500/50"
                  title="Recupera y reimprime un comprobante por número de fila de Google Sheets (ej: fila 135)"
                >
                  <i className="fa-solid fa-magnifying-glass-location text-emerald-400"></i>
                  <span>Reimprimir Fila</span>
                </button>

                {/* Exportar Lote PDF */}
                <button
                  type="button"
                  onClick={handleExportBatchPDF}
                  disabled={isBatchExporting || retentions.length === 0}
                  className="inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:border-slate-600"
                  title="Genera un único PDF concatenando todos los comprobantes del historial"
                >
                  <i className={`fa-solid fa-layer-group text-orange-400 ${isBatchExporting ? 'fa-spin' : ''}`}></i>
                  <span>Lote PDF</span>
                </button>

                {/* Exportar TXT DGR */}
                <button
                  type="button"
                  onClick={() => setShowTxtModal(true)}
                  disabled={retentions.length === 0}
                  className="inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:border-slate-600"
                  title="Exporta el archivo de texto en formato oficial para el aplicativo DGR San Juan"
                >
                  <i className="fa-solid fa-file-code text-emerald-400"></i>
                  <span>TXT DGR</span>
                </button>

                {/* Enlace directo a Google Sheets */}
                <a
                  href={spreadsheetUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-emerald-950/50 hover:bg-emerald-900/70 border border-emerald-600/60 text-emerald-300 transition-all shadow-xs"
                  title="Abrir la planilla vinculada en Google Sheets"
                >
                  <i className="fa-solid fa-table text-emerald-400"></i>
                  <span>Ver Sheets</span>
                  <i className="fa-solid fa-arrow-up-right-from-square text-[10px] ml-0.5 opacity-80"></i>
                </a>

                {/* Configuración */}
                <button
                  type="button"
                  onClick={() => setShowSettingsModal(true)}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all hover:border-orange-500/50"
                  title="Configuración de URLs, firma digital y respaldos"
                >
                  <i className="fa-solid fa-gear text-slate-400"></i>
                  <span>Configuración</span>
                </button>

                {/* Bloquear Sesión */}
                <button
                  type="button"
                  onClick={handleLockSession}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-rose-950/70 border border-slate-700 hover:border-rose-500/50 text-slate-300 hover:text-rose-300 transition-all"
                  title="Bloquear acceso y volver a pedir contraseña"
                >
                  <i className="fa-solid fa-lock text-slate-400"></i>
                  <span className="hidden md:inline">Bloquear</span>
                </button>
              </div>

            </div>
          </header>

          {/* CONTENIDO PRINCIPAL: 2 COLUMNAS */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

              {/* COLUMNA IZQUIERDA: FORMULARIO DE EMISIÓN */}
              <section className="lg:col-span-7 space-y-6">
                
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 relative">
                  
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-orange-50 border border-orange-200 flex items-center justify-center text-bailac">
                        <i className="fa-solid fa-pen-nib text-sm"></i>
                      </div>
                      <div>
                        <h2 className="text-base font-bold text-slate-800">Emisión de Comprobante</h2>
                        <p className="text-xs text-slate-500">Completa los datos del sujeto retenido y la factura de origen</p>
                      </div>
                    </div>
                    
                    {/* Selector de Prefijo (RET- / 001-) */}
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs">
                      <span className="text-[10px] font-bold text-slate-500 px-1">Formato:</span>
                      <button
                        type="button"
                        onClick={() => setNumberPrefix('RET')}
                        className={`px-2 py-0.5 rounded font-mono font-bold text-xs transition-colors ${
                          numberPrefix === 'RET' ? 'bg-white text-bailac shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        RET-
                      </button>
                      <button
                        type="button"
                        onClick={() => setNumberPrefix('001')}
                        className={`px-2 py-0.5 rounded font-mono font-bold text-xs transition-colors ${
                          numberPrefix === '001' ? 'bg-white text-bailac shadow-xs' : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        001-
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleEmitRetention} className="space-y-4">

                    {/* BUSCADOR Y AUTOCOMPLETADO DE PROVEEDORES */}
                    <div className="relative">
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600">
                          Buscar Sujeto Retenido (CUIT o Razón Social)
                        </label>
                        <span className="text-[11px] text-slate-400">
                          {knownSubjects.length} proveedores disponibles
                        </span>
                      </div>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                          <i className="fa-solid fa-magnifying-glass text-xs"></i>
                        </div>
                        <input
                          type="text"
                          value={searchTerm}
                          onChange={(e) => {
                            setSearchTerm(e.target.value);
                            setShowDropdown(true);
                          }}
                          onFocus={() => setShowDropdown(true)}
                          placeholder="Escribe el nombre o CUIT para buscar entre proveedores reales..."
                          className="w-full pl-9 pr-8 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-bailac transition-all"
                        />
                        {searchTerm && (
                          <button
                            type="button"
                            onClick={() => { setSearchTerm(''); setShowDropdown(false); }}
                            className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                          >
                            <i className="fa-solid fa-xmark text-xs"></i>
                          </button>
                        )}
                      </div>

                      {showDropdown && filteredSubjects.length > 0 && (
                        <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden max-h-56 overflow-y-auto">
                          <div className="px-3 py-1.5 bg-slate-50 text-[10px] font-semibold text-slate-500 border-b border-slate-100 flex justify-between">
                            <span>Sujetos encontrados ({filteredSubjects.length})</span>
                            <span>Haz clic para autocompletar</span>
                          </div>
                          {filteredSubjects.map((s, idx) => (
                            <button
                              key={idx}
                              type="button"
                              onClick={() => handleSelectSubject(s)}
                              className="w-full text-left px-3 py-2.5 hover:bg-orange-50/70 border-b border-slate-100 last:border-0 transition-colors flex items-center justify-between group"
                            >
                              <div>
                                <p className="text-xs font-bold text-slate-800 group-hover:text-bailac">{s.razonSocial}</p>
                                <p className="text-[11px] text-slate-500 font-mono">CUIT: {s.cuit} · IIBB: {s.nroIIBB || 'N/A'}</p>
                              </div>
                              <div className="text-right">
                                <span className="inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700 group-hover:bg-orange-100 group-hover:text-orange-800">
                                  {s.taxType === 'IIBB' ? 'Local' : 'CM'} ({s.alicuota}%)
                                </span>
                              </div>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* DATOS DEL SUJETO RETENIDO */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          CUIT del Proveedor <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="text"
                          required
                          value={cuit}
                          onChange={(e) => setCuit(e.target.value)}
                          placeholder="30-71155040-9"
                          className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-bailac font-mono transition-all"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          Razón Social / Denominación <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="text"
                          required
                          value={razonSocial}
                          onChange={(e) => setRazonSocial(e.target.value)}
                          placeholder="Nombre comercial o social"
                          className="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-bailac uppercase transition-all"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          N° Inscripción IIBB
                        </label>
                        <input
                          type="text"
                          value={nroIIBB}

 * Función para GUARDAR datos (POST)
 */
function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    var fechaFormateada = new Date(data.date);
    
    // Agregamos fila con los 12 campos definidos
    sheet.appendRow([
      data.retentionNumber, // Col A (0)
      fechaFormateada,      // Col B (1)
      data.razonSocial,     // Col C (2)
      data.cuit,            // Col D (3)
      data.nroIIBB,         // Col E (4)
      data.domicilio,       // Col F (5)
      data.taxType,         // Col G (6)
      data.nroFactura,      // Col H (7)
      data.baseImponible,   // Col I (8)
      data.alicuota,        // Col J (9)
      data.total,           // Col K (10)
      data.observaciones    // Col L (11)
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({"status":"success"}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({"status":"error", "message": err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

/**
 * Función para LEER datos (GET)
 * Sirve para sincronizar sujetos y para REIMPRIMIR por número de fila
 */
function doGet(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    
    // CASO 1: RECUPERAR COMPROBANTE POR FILA
    if (e && e.parameter && e.parameter.row) {
      var rowNum = parseInt(e.parameter.row);
      // Obtenemos los datos de la fila (de la columna A a la L, que son 12 columnas)
      var rowData = sheet.getRange(rowNum, 1, 1, 12).getValues()[0];
      
      if (!rowData[0]) throw new Error("La fila está vacía");
      
      var retention = {
        retentionNumber: rowData[0],
        date: rowData[1],
        razonSocial: rowData[2],
        cuit: rowData[3].toString(),
        nroIIBB: rowData[4].toString(),
        domicilio: rowData[5].toString(),
        taxType: rowData[6] || 'CM',
        nroFactura: rowData[7].toString(),
        baseImponible: parseFloat(rowData[8]) || 0,
        alicuota: parseFloat(rowData[9]) || 0,
        total: parseFloat(rowData[10]) || 0,
        observaciones: rowData[11] || '',
        id: Date.now(), // ID temporal para la App
        synced: true
      };
      
      return ContentService.createTextOutput(JSON.stringify({ "status": "success", "retention": retention }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    // CASO 2: SINCRONIZAR SUJETOS (Comportamiento actual)
    var rows = sheet.getDataRange().getValues();
    var subjects = {};

    for (var i = 1; i < rows.length; i++) {
        var razonSocial = rows[i][2]; // Columna C
        var cuit = rows[i][3];        // Columna D
        var nroIIBB = rows[i][4];     // Columna E
        var domicilio = rows[i][5];   // Columna F
        var taxType = rows[i][6];     // Columna G
        var alicuota = rows[i][9];    // Columna J (Alícuota)

        if (razonSocial) {
            subjects[razonSocial] = {
                razonSocial: razonSocial,
                cuit: cuit.toString(),
                nroIIBB: nroIIBB.toString(),
                domicilio: domicilio.toString(),
                taxType: taxType || 'CM',
                alicuota: parseFloat(alicuota) || 0
            };
        }
    }

    var result = Object.keys(subjects).map(function(key) { return subjects[key]; });
    
    return ContentService.createTextOutput(JSON.stringify({ "subjects": result }))
      .setMimeType(ContentService.MimeType.JSON);
      
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ "error": err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}
